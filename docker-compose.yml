# Local WordPress for texasiplawhelp.com only.
# Separate from the firm site (texas_ip_law): own project name, port, and volumes.
name: texas-ip-law-help

services:
  wordpress:
    image: wordpress:6-php8.2-apache
    ports:
      - "${HELP_WP_PORT:-8082}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: help_user
      WORDPRESS_DB_PASSWORD: help_pass
      WORDPRESS_DB_NAME: help_db
      # Grok AI. Leave unset for demo mode. See README "Grok AI and spending caps".
      HELP_XAI_API_KEY: ${HELP_XAI_API_KEY:-}
      HELP_XAI_MODEL: ${HELP_XAI_MODEL:-grok-3-mini}
      HELP_XAI_ENDPOINT: ${HELP_XAI_ENDPOINT:-https://api.x.ai/v1/chat/completions}
      HELP_AI_DAILY_TOKEN_CAP: ${HELP_AI_DAILY_TOKEN_CAP:-150000}
      HELP_AI_IP_HOURLY: ${HELP_AI_IP_HOURLY:-15}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - help_wp_data:/var/www/html
      - ./wordpress/theme/texas-ip-law-help:/var/www/html/wp-content/themes/texas-ip-law-help
      - ./docker/mu-plugins/local-mail.php:/var/www/html/wp-content/mu-plugins/local-mail.php:ro
    depends_on:
      db:
        condition: service_healthy

  # Catches all outgoing mail locally. Inbox UI: http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${HELP_MAIL_UI_PORT:-8026}:8025"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: help_db
      MYSQL_USER: help_user
      MYSQL_PASSWORD: help_pass
      MYSQL_ROOT_PASSWORD: help_root
    volumes:
      - help_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-phelp_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: help_user
      WORDPRESS_DB_PASSWORD: help_pass
      WORDPRESS_DB_NAME: help_db
    volumes:
      - help_wp_data:/var/www/html
      - ./wordpress/theme/texas-ip-law-help:/var/www/html/wp-content/themes/texas-ip-law-help

volumes:
  help_wp_data:
  help_db_data:
