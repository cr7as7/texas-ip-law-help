name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint theme PHP
        run: |
          status=0
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" || status=1
          done < <(find wordpress/theme -name '*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No theme PHP files to lint"
            exit 1
          fi
          exit "$status"

      - name: Theme is a valid WordPress theme
        run: |
          T=wordpress/theme/texas-ip-law-help
          for f in style.css index.php functions.php header.php footer.php front-page.php page.php single.php home.php 404.php assets/js/help.js; do
            test -f "$T/$f" || { echo "Missing $T/$f"; exit 1; }
          done
          grep -q '^Theme Name: Texas IP Law Help' "$T/style.css" || { echo "style.css is missing the theme header"; exit 1; }
          for f in inc/ai.php assets/images/favicon.svg assets/images/og-default.png; do
            test -f "$T/$f" || { echo "Missing $T/$f"; exit 1; }
          done
          for k in home guides guides-patent guides-trademark guides-copyright resources ask faq about disclaimer privacy contact search-results; do
            test -f "$T/template-parts/pages/$k.php" || { echo "Missing page part: $k"; exit 1; }
          done

      - name: No external CDNs or web-font hosts in the theme
        run: |
          if grep -rEn "fonts\.googleapis\.com|fonts\.gstatic\.com|cdnjs\.|unpkg\.com|jsdelivr\.net|code\.jquery\.com" wordpress/theme; then
            echo "External asset host found. Self-host it (see SEO and privacy rules)."
            exit 1
          fi

      - name: No API keys or secrets committed in the theme or scripts
        run: |
          if grep -rEn "xai-[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}" wordpress scripts docker docker-compose.yml; then
            echo "Looks like an API key. Remove it and rotate the key."
            exit 1
          fi

      - name: Every page has one H1 in its template
        run: |
          fail=0
          for f in wordpress/theme/texas-ip-law-help/template-parts/pages/*.php; do
            n=$(grep -o '<h1' "$f" | wc -l | tr -d ' ')
            if [ "$n" -ne 1 ]; then echo "$f has $n <h1> tags"; fail=1; fi
          done
          exit "$fail"

      - name: Build static preview
        run: bash scripts/build-texasiplawhelp-dist.sh

      - name: Preview bundle includes the homepage
        run: test -f static/dist/index.html
